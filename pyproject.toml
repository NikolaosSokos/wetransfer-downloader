[project]
name = "wetransfer-downloader"
version = "0.1.0"
description = "A WeTransfer web scraping downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "playwright>=1.56.0",
]

# CLI entry point
[project.scripts]
wtdownload = "wetransfer_downloader.cli:main"

# REQUIRED for packaged apps using a src/ layout
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
